name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      # The release workflow smoke-tests every artifact with --version, after
      # the release tag exists. This catches a binary that no longer answers it,
      # or answers with another version, while it is still a pull request. On
      # Windows it also covers the windowed release build printing to a pipe.
      - name: Check --version
        shell: bash
        run: |
          expected="avalon $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          actual=$(target/release/avalon --version)
          [ "$actual" = "$expected" ] \
            || { echo "::error::avalon --version printed '$actual', expected '$expected'"; exit 1; }

      - name: Test
        run: cargo test --locked

  # Cargo.toml declares rust-version. This job is what keeps that promise
  # true: it builds on exactly that toolchain.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: cargo check --locked --all-targets

  # GitHub's Dependabot alerts only cover advisories that have a GHSA id.
  # RustSec publishes some that never get one, so cargo audit reads the
  # RustSec database directly. Vulnerabilities fail the job; unmaintained
  # and unsound notices are printed as warnings.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # These eight zip advisories only match zip 8.6.0, which docx-rs
          # 0.4.22 (its latest release) requires as ^8.6. No patched 8.x
          # exists. docx-rs builds zip with only the deflate feature, so the
          # AES (RUSTSEC-2026-0545) and legacy-zip (RUSTSEC-2026-0547) code is
          # not compiled. The others concern ZipArchive::extract and stream
          # extraction (ZipStreamReader); docx-rs never calls either, and
          # Avalon uses docx-rs only to write files. Avalon's own zip
          # dependency is 9.8.2, which is patched. Remove this list once a
          # docx-rs release moves to zip 9.
          ignore: RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0429,RUSTSEC-2026-0545,RUSTSEC-2026-0546,RUSTSEC-2026-0547,RUSTSEC-2026-0548

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.6 --locked

      - name: Generate coverage
        run: cargo tarpaulin --out xml --skip-clean

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cobertura.xml
          fail_ci_if_error: false
