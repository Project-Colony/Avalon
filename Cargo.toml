[package]
name = "avalon"
version = "0.1.0"
edition = "2021"
authors = ["MotherSphere"]
description = "A free, open-source writing studio inspired by Scrivener, built in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
# GUI Framework
iced = { version = "0.13", features = ["canvas", "tokio", "svg", "image", "advanced"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File system
dirs = "5"
walkdir = "2"
notify = "7"

# Rich text / document processing
pulldown-cmark = "0.12"
pulldown-cmark-to-cmark = "17"

# Export formats
printpdf = "0.7"
docx-rs = "0.4"
zip = "2"

# Spell checking
# hunspell-rs requires system libhunspell — disabled by default
# hunspell-rs = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime (for iced)
tokio = { version = "1", features = ["full"] }

# Regex for search
regex = "1"

# Clipboard
arboard = "3"

# Temp files (used by print module)
tempfile = "3"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true
