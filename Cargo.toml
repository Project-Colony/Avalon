[package]
name = "avalon"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["MotherSphere"]
description = "A writing studio for novels and long-form projects, built in Rust with iced"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Avalon"
readme = "README.md"

[dependencies]
# GUI Framework
iced = { version = "0.14.0", features = ["tokio"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"

# File system
dirs = "5.0.1"
walkdir = "2.5.0"
notify = "7.0.0"

# Rich text / document processing
pulldown-cmark = "0.12.2"
pulldown-cmark-to-cmark = "17.0.0"

# Export formats
printpdf = "0.7.0"
docx-rs = "0.4.22"
zip = "8.6.0"

# Spell checking
# hunspell-rs requires system libhunspell — disabled by default
# hunspell-rs = "0.4"

# Date/time
chrono = { version = "0.4.45", features = ["serde"] }

# Unique IDs
uuid = { version = "1.27.0", features = ["v4", "serde"] }

# Logging
log = "0.4.34"
env_logger = "0.11.11"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Async runtime (for iced)
tokio = { version = "1.53.2", features = ["full"] }

# Regex for search
regex = "1.13.1"

# Clipboard
arboard = "3.6.1"

# Native open and save dialogs. On Linux the XDG desktop portal backend talks
# to D-Bus through libdbus loaded at run time, so the build needs no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Temp files (used by print module)
tempfile = "3.27.0"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true
